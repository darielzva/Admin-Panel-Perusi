name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies & Lief
      run: |
        brew install p7zip
        pip install lief
        sudo ln -sf /opt/homebrew/bin/7z /usr/local/bin/7z.exe || sudo ln -sf /usr/local/bin/7z /usr/local/bin/7z.exe

    - name: Locate Xcode iOS SDK & Tools
      run: |
        echo "IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
        
        mkdir -p app/ff_manager/.tools
        
        # Enlazamos las herramientas principales
        ln -sf $(xcrun --find clang) app/ff_manager/.tools/clang.exe
        ln -sf $(xcrun --find clang) app/ff_manager/.tools/ld64.lld.exe
        ln -sf $(xcrun --find lipo) app/ff_manager/.tools/llvm-lipo.exe
        ln -sf $(which install_name_tool) app/ff_manager/.tools/llvm-install-name-tool.exe
        
        # Creamos un script wrapper en Python para llvm-strip.exe que traduzca --strip-debug a sintaxis de Mac
        cat << 'EOF' > app/ff_manager/.tools/llvm-strip.exe
        #!/usr/bin/env python3
        import sys
        import subprocess

        args = sys.argv[1:]
        # Reemplazamos --strip-debug por -S (equivalente en macOS)
        new_args = ['-S' if arg == '--strip-debug' else arg for arg in args]
        
        # Ejecutamos el strip nativo de macOS
        cmd = ['strip'] + new_args
        sys.exit(subprocess.run(cmd).returncode)
        EOF
        chmod +x app/ff_manager/.tools/llvm-strip.exe
        
        echo "FF_TOOLS_ROOT=$GITHUB_WORKSPACE/app/ff_manager/.tools" >> $GITHUB_ENV

    - name: Run Build Script
      shell: pwsh
      run: |
        cd app/ff_manager
        ./build.ps1 -Offline
    
    - name: Upload Generated IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RobotExternal-Unsigned-IPA
        path: app/ff_manager/release/*.ipa
