name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies & Lief
      run: |
        brew install p7zip
        pip install lief
        sudo ln -sf /opt/homebrew/bin/7z /usr/local/bin/7z.exe || sudo ln -sf /usr/local/bin/7z /usr/local/bin/7z.exe

    - name: Locate Xcode iOS SDK & Tools
      run: |
        echo "IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)" >> $GITHUB_ENV
        
        mkdir -p app/ff_manager/.tools
        
        # Enlazamos clang y lipo de forma directa
        ln -sf $(xcrun --find clang) app/ff_manager/.tools/clang.exe
        ln -sf $(xcrun --find lipo) app/ff_manager/.tools/llvm-lipo.exe
        
        # Creamos un script wrapper en Python para ld64.lld.exe que actúe como un enlazador compatible con Apple/Clang
        cat << 'EOF' > app/ff_manager/.tools/ld64.lld.exe
        #!/usr/bin/env python3
        import sys
        import subprocess

        # Cuando el script de PowerShell llama al enlazador, le pasa banderas de ld.
        # Las traducimos para que clang las acepte correctamente en macOS.
        args = sys.argv[1:]
        
        # Reconstruimos la llamada usando clang como frontend de enlace para iOS
        new_args = ['clang', '-target', 'arm64-apple-ios15.0']
        
        skip_next = False
        for i, arg in enumerate(args):
            if skip_next:
                skip_next = False
                continue
            if arg == '-platform_version':
                skip_next = True # saltamos 'ios' y las versiones
                continue
            if arg in ['ios', '15.0']:
                continue
            if arg == '-adhoc_codesign':
                continue # clang maneja la firma ad-hoc por defecto o se ignora en este paso
                
            new_args.append(arg)

        sys.exit(subprocess.run(new_args).returncode)
        EOF
        chmod +x app/ff_manager/.tools/ld64.lld.exe

        # Creamos el wrapper para llvm-install-name-tool.exe
        cat << 'EOF' > app/ff_manager/.tools/llvm-install-name-tool.exe
        #!/usr/bin/env python3
        import sys
        import subprocess
        args = sys.argv[1:]
        cmd = ['install_name_tool'] + args
        sys.exit(subprocess.run(cmd).returncode)
        EOF
        chmod +x app/ff_manager/.tools/llvm-install-name-tool.exe

        # Creamos el wrapper para llvm-strip.exe
        cat << 'EOF' > app/ff_manager/.tools/llvm-strip.exe
        #!/usr/bin/env python3
        import sys
        import subprocess
        args = sys.argv[1:]
        new_args = ['-S' if arg == '--strip-debug' else arg for arg in args]
        cmd = ['strip'] + new_args
        sys.exit(subprocess.run(cmd).returncode)
        EOF
        chmod +x app/ff_manager/.tools/llvm-strip.exe
        
        echo "FF_TOOLS_ROOT=$GITHUB_WORKSPACE/app/ff_manager/.tools" >> $GITHUB_ENV

    - name: Run Build Script
      shell: pwsh
      run: |
        cd app/ff_manager
        ./build.ps1 -Offline
    
    - name: Upload Generated IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RobotExternal-Unsigned-IPA
        path: app/ff_manager/release/*.ipa
